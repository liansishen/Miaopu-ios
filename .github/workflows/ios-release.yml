name: iOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).fetch("settings").fetch("base").fetch("MARKETING_VERSION")' ios/project.yml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "::error::Tag $GITHUB_REF_NAME does not match app version $version."
              exit 1
            }
            test -f "docs/releases/$version.md"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Run simulator tests
        shell: bash
        run: |
          set -euo pipefail
          destination="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices", {}).values.flatten
            device = devices.find { |entry| entry["name"].include?("iPhone") }
            puts(device ? "platform=iOS Simulator,id=#{device.fetch("udid")}" : "")
          ')"
          if [[ -z "$destination" ]]; then
            echo "::error::No available iPhone simulator for required tests."
            exit 1
          fi
          xcodebuild test -project ios/Miaopu.xcodeproj -scheme Miaopu \
            -destination "$destination" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Miaopu.xcodeproj -scheme Miaopu \
            -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
          app="$(pwd)/build/DerivedData/Build/Products/Release-iphoneos/Miaopu.app"
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          [[ "$built_version" == "$VERSION" ]] || {
            echo "::error::Built app version $built_version does not match $VERSION."
            exit 1
          }
          mkdir -p dist
          APP_PATH="$app" OUTPUT_IPA="$(pwd)/dist/Miaopu-$VERSION-unsigned.ipa" \
            scripts/package-unsigned-ipa.sh

      - name: Upload unsigned IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: miaopu-unsigned-ipa
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: miaopu-unsigned-ipa
          path: dist

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ipa="Miaopu-$version-unsigned.ipa"
          test -f "docs/releases/$version.md"
          test -f "dist/$ipa"
          test -f "dist/$ipa.sha256"
          (cd dist && sha256sum -c "$ipa.sha256" && unzip -tq "$ipa")
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ipa" "dist/$ipa.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "喵扑 iOS $version" \
            --notes-file "docs/releases/$version.md"
