name: Miaopu
options:
  bundleIdPrefix: com.liansishen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.0.3"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
targets:
  Miaopu:
    type: application
    platform: iOS
    sources:
      - path: Miaopu
        optional: false
    dependencies:
      - target: MiaopuWidgets
    entitlements:
      path: Miaopu/Miaopu.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.liansishen.miaopu
    info:
      path: Miaopu/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: 喵扑
        NSPhotoLibraryAddUsageDescription: 保存评论图片到相册
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - miaopu
    settings:
      base:
        PRODUCT_NAME: Miaopu
        PRODUCT_BUNDLE_IDENTIFIER: com.liansishen.miaopu
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MiaopuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MiaopuWidgets
      - path: Miaopu/Widget/WidgetSnapshotStore.swift
      - path: Miaopu/Data/Match.swift
    entitlements:
      path: MiaopuWidgets/MiaopuWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.liansishen.miaopu
    info:
      path: MiaopuWidgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: MiaopuWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.liansishen.miaopu.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MiaopuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiaopuTests
        optional: false
    dependencies:
      - target: Miaopu
    settings:
      base:
        PRODUCT_NAME: MiaopuTests
        PRODUCT_BUNDLE_IDENTIFIER: com.liansishen.miaopu.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MiaopuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiaopuUITests
    dependencies:
      - target: Miaopu
    settings:
      base:
        PRODUCT_NAME: MiaopuUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.liansishen.miaopu.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Miaopu:
    build:
      targets:
        Miaopu: all
        MiaopuWidgets: all
        MiaopuTests: [test]
        MiaopuUITests: [test]
    test:
      targets:
        - MiaopuTests
        - MiaopuUITests
